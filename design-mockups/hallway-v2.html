<!DOCTYPE html>
<!--
  Claude Design export — the source of design-mockups/dashboard-v2.png.
  Kept for the exact hex values and component specs the v2 design system
  (src/components/ui) was derived from. Not part of the app.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { background: #0A1633; font-family: Sora, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #11141B; -webkit-font-smoothing: antialiased; }
  a { color: #FFFFFF; text-decoration: none; }
  a:hover { color: #FFD9A8; }
  button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
</style>
</helmet>
<div style="min-height: 100vh; background: radial-gradient(120% 70% at 12% 0%, #1E3A75 0%, #14284F 42%, #0A1633 100%); position: relative; overflow: hidden;">

  <div style="position: absolute; top: -90px; right: -70px; width: 300px; height: 300px; border-radius: 999px; background: radial-gradient(circle, rgba(247,178,103,0.22) 0%, rgba(247,178,103,0) 68%); pointer-events: none;"></div>
  <div style="position: absolute; top: 200px; left: -130px; width: 340px; height: 340px; border-radius: 999px; background: radial-gradient(circle, rgba(93,143,255,0.22) 0%, rgba(93,143,255,0) 70%); pointer-events: none;"></div>

  <div style="position: relative; max-width: 460px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 20px 118px;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <a href="#" aria-label="Back to Tudor Hall" style="width: 44px; height: 44px; border-radius: 999px; background: linear-gradient(160deg, rgba(255,255,255,0.20), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 18px rgba(4,10,26,0.45); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #FFFFFF;">‹</a>

      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.2em; color: rgba(255,255,255,0.5);">TUDOR HALL</div><div style="margin-top: 3px; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; color: rgba(255,255,255,0.38);">FLOOR 1 · HOLIDAY WING</div><div style="text-align: center;"></div>
    </div>

    <div style="margin-top: 26px; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;">
      <div>
        <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; color: #FFFFFF;">Holiday 1</h1>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
          <div style="width: 22px; height: 22px; border-radius: 999px; background: linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0.12)); border: 1px solid rgba(255,255,255,0.28); color: #FFFFFF; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center;">JL</div>
          <div style="font-size: 12.5px; color: rgba(255,255,255,0.6);">Covered by Jordan Lee · RA</div>
        </div>
      </div>
    </div>

    <div style="margin-top: 26px; border-radius: 30px 30px 26px 26px; background: linear-gradient(180deg, #FFFFFF 0%, #F6F8FC 100%); box-shadow: 0 -6px 0 rgba(255,255,255,0.10), 0 22px 50px rgba(4,10,26,0.45); padding: 20px 16px 18px;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px;">
        <div style="font-size: 17px; font-weight: 700; color: #16264A; letter-spacing: -0.01em;">Rooms</div>
        <div style="font-size: 11.5px; color: #737C90;">9 rooms · 18 beds</div>
      </div>

      <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px;">
        <a href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 11px 11px 10px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E9F1; box-shadow: 0 2px 6px rgba(15,29,58,0.05);">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
            <div style="width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(150deg, #23386C 0%, #16264A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 5px 11px rgba(15,29,58,0.26); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 12px; font-weight: 700;">101</div>
            <div style="width: 8px; height: 8px; border-radius: 999px; background: #16264A;"></div>
          </div>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: #11141B;">2/2</div>
            <div style="margin-top: 2px; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; color: #8A93A6;">RESIDENTS IN</div>
          </div>
        </a>
        <!-- away room: border #F0BE83, dot #F7B267 · empty room: dot #DDE1EA -->
      </div>

      <div style="margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px;">
        <div style="font-size: 17px; font-weight: 700; color: #16264A; letter-spacing: -0.01em;">Roster</div>
        <div style="display: flex; gap: 6px;">
          <button style="font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: #16264A; color: #FFFFFF;">All 9</button>
          <button style="font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: #EEF1F7; color: #5A6478;">Away 2</button>
        </div>
      </div>

      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E9F1; box-shadow: 0 2px 6px rgba(15,29,58,0.05);">
          <div style="flex: none; width: 38px; height: 38px; border-radius: 999px; background: linear-gradient(150deg, #23386C 0%, #16264A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 5px 11px rgba(15,29,58,0.26); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 12px; font-weight: 600;">AW</div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px; font-weight: 600; color: #11141B; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Amara Whitfield</div>
            <div style="margin-top: 3px; font-size: 11.5px; color: #737C90;">Room 101 · In building</div>
          </div>
          <!-- checked-out pill: background #F1F3F8, color #737C90 -->
          <button aria-label="Toggle presence" style="flex: none; width: 52px; height: 30px; border-radius: 999px; padding: 3px; display: flex; align-items: center; justify-content: flex-end; background: #16264A; border: 1px solid #16264A; box-shadow: inset 0 1px 3px rgba(15,29,58,0.18);">
            <span style="display: block; width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 5px rgba(15,29,58,0.35);"></span>
          </button>
          <!-- away toggle: track #F7B267, border #E09A45, knob at flex-start; away row border #F0BE83 -->
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
